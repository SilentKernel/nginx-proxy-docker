# Nightly build of the nginx-proxy image. Runs on our amd64 VM runner (shell executor, see
# docs/runner.md). On the default branch (push, nightly schedule, manual "Run pipeline") the image is
# rebuilt on the latest official nginx:1.30-trixie + Debian updates, tested, and pushed to our
# registry only when its content changed (build.sh: a restart of the proxy cuts every site, the
# server must only be offered a real change); elsewhere (merge requests, other branches) it is built
# and tested only. Every gate (version floor, proxy smoke tests with upstream's and the server's
# template, no Debian update pending, negative tests, CVE gate) runs inside build.sh before anything
# is pushed.
#
# After each publishing pipeline, mirror:dockerhub copies what the registry serves to Docker Hub
# (DOCKERHUB_IMAGE below, public backup); it never blocks the publish.
#
# CI/CD variables (Settings > CI/CD > Variables): NTFY_TOPIC (notifications; unset = none),
# NTFY_TOPIC_NEWBASE (instance level, masked: the "new version" message only; unset = not sent),
# NTFY_TOKEN (masked, optional), DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (Docker Hub personal access
# token, Read & Write; masked, protected). Pipeline variable: FORCE_PUSH=1 pushes an unchanged content.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [test, build, downstream, notify]

default:
  tags: [nginx-proxy-amd64]

variables:
  NTFY_URL: https://notif.developpeur-freelance.io
  # Scanner of tests/scan.sh (refuses only a new fixable CRITICAL), pinned by digest, as in
  # frankenphp-docker. To update: check the release, then `docker buildx imagetools inspect aquasec/trivy:<version>`.
  # Public backup of the image (job mirror:dockerhub). Here, not in versions.env: build.sh hashes
  # versions.env into the content fingerprint, and the backup's name must not change the image.
  DOCKERHUB_IMAGE: docker.io/silentk/nginx-proxy-docker
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

# Publishing pipelines: default branch, pushed to, scheduled or started by hand.
.publish: &publish
  if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(push|schedule|web)$/

# The shell executor shares the gitlab-runner user's home: each job logs in to the registry with
# its own Docker config, outside the checkout (build.sh refuses to push from a dirty tree).
.registry:
  variables:
    DOCKER_CONFIG: $CI_BUILDS_DIR/docker-config-$CI_JOB_ID
  before_script:
    - mkdir -p "$DOCKER_CONFIG"
    - echo "$CI_JOB_TOKEN" | docker login "$CI_REGISTRY" -u gitlab-ci-token --password-stdin
    - set -a; . ./versions.env; set +a
    - '[ "$IMAGE" = "$CI_REGISTRY_IMAGE" ] || { echo "IMAGE in versions.env ($IMAGE) is not this project''s registry ($CI_REGISTRY_IMAGE)" >&2; exit 1; }'
  after_script:
    - rm -rf "$DOCKER_CONFIG"

unit:
  stage: test
  script:
    - tests/unit.sh

# The nginx floor on nginx:1.30.5, the Go floor on golang:1.27.2 and on go-docker (registry login).
guard:
  stage: test
  extends: .registry
  script:
    - tests/guard.sh

build:
  stage: build
  extends: .registry
  resource_group: nginx-proxy
  timeout: 30m
  rules:
    - <<: *publish
      variables:
        BUILD_ARGS: --push
    - when: on_success
      variables:
        BUILD_ARGS: ""
  script:
    - ./build.sh $BUILD_ARGS ${FORCE_PUSH:+--force}
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - trivy-report.json
      - trivy-report.txt
      - trivy-published.json

# After a publish, rebuild everything built on this image: deploy-automation fans out to the
# dependent projects (dependents.json there) and, with strategy: depend, their result shows here.
trigger:dependents:
  stage: downstream
  rules:
    - <<: *publish
      when: on_success
  variables:
    BASE: nginx-proxy-docker
    BASE_REF: $CI_COMMIT_SHA
  trigger:
    project: silent/deploy-automation
    branch: main
    strategy: depend

# Public backup on Docker Hub of what the registry now serves (scripts/mirror-dockerhub.sh): runs on
# every publishing pipeline, also when build pushed nothing, and copies only the tags Docker Hub lacks
# or serves differently, so a missed night is repaired by the next one. allow_failure: a Docker Hub
# outage must not turn the publish red; the script sends its own ntfy alert.
mirror:dockerhub:
  stage: downstream
  extends: .registry
  resource_group: nginx-proxy
  needs: [build]
  allow_failure: true
  timeout: 15m
  rules:
    - <<: *publish
      when: on_success
  script:
    - '[ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ] || { echo "DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set (Settings > CI/CD > Variables)" >&2; scripts/notify.sh high warning "nginx-proxy-docker: Docker Hub backup not configured" "DOCKERHUB_USERNAME / DOCKERHUB_TOKEN missing: nothing mirrored."; exit 1; }'
    - echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
    - scripts/mirror-dockerhub.sh "$IMAGE" "$DOCKERHUB_IMAGE"

notify:failure:
  stage: notify
  rules:
    - <<: *publish
      when: on_failure
  script:
    - >
      scripts/notify.sh urgent rotating_light
      "nginx-proxy-docker: ${CI_PIPELINE_SOURCE} pipeline FAILED"
      "Pipeline #${CI_PIPELINE_IID} on ${CI_COMMIT_SHORT_SHA} failed. The moving tags keep their previous image unless a push step itself broke. Open the pipeline to see which gate refused."
